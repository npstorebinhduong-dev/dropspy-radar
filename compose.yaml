services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropspy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropspy}
      POSTGRES_DB: ${POSTGRES_DB:-dropspy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      MODE: ${MODE:-demo}
      ENABLE_META_PUBLIC_COLLECTION: ${ENABLE_META_PUBLIC_COLLECTION:-0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dropspy:dropspy@db:5432/dropspy}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
