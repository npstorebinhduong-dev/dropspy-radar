name: MVP and data-core checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres_tests:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: coretest
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: coretests
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U coretest -d coretests"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://coretest:isolated-test-only@127.0.0.1:55432/coretests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d --wait
      - run: .venv/bin/python scripts/smoke.py
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
